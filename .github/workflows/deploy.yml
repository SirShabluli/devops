name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-app:test .

      - name: Validate Docker Compose
        run: docker compose config

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/mitziel/node-postgres-app

            echo "Saving current working commit..."
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit: $PREVIOUS_COMMIT"

            echo "Deploying new version..."
            git fetch origin main
            git reset --hard origin/main

            docker compose up -d --build

            echo "Checking new version..."

            if curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8083; then
              echo "Deployment successful"
            else
              echo "Deployment failed — rolling back to $PREVIOUS_COMMIT"

              git reset --hard "$PREVIOUS_COMMIT"
              docker compose up -d --build

              echo "Checking rolled back version..."
              curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:8083

              echo "Rollback successful"
              exit 1
            fi
 